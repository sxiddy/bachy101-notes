<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Types of soil pollution</text><circle cx="300" cy="235" r="66" class="dfo dso" fill-opacity=".35" stroke-width="3"/><text x="300" y="220" font-size="26" font-weight="700" class="dt" text-anchor="middle">Soil</text><text x="300" y="248" font-size="24" font-weight="700" class="dt" text-anchor="middle">pollution</text><rect x="14" y="58" width="190" height="90" class="dfy dsy" rx="10" fill-opacity=".3" stroke-width="3"/><text x="109" y="97" font-size="22" font-weight="700" class="dt" text-anchor="middle">Domestic and</text><text x="109" y="125" font-size="22" class="dt" text-anchor="middle">industrial waste</text><path d="M204 103L238 182.2" class="dso" fill="none" stroke-width="3.5" marker-end="url(#o)"/><rect x="14" y="178" width="190" height="90" class="dfy dsy" rx="10" fill-opacity=".3" stroke-width="3"/><text x="109" y="231" font-size="22" font-weight="700" class="dt" text-anchor="middle">Agricultural</text><path d="M204 223L238 230.2" class="dso" fill="none" stroke-width="3.5" marker-end="url(#o)"/><rect x="14" y="298" width="190" height="90" class="dfy dsy" rx="10" fill-opacity=".3" stroke-width="3"/><text x="109" y="351" font-size="22" font-weight="700" class="dt" text-anchor="middle">Urban activities</text><path d="M204 343L238 278.2" class="dso" fill="none" stroke-width="3.5" marker-end="url(#o)"/><rect x="396" y="58" width="190" height="90" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="491" y="97" font-size="22" font-weight="700" class="dt" text-anchor="middle">Continuous</text><text x="491" y="125" font-size="22" class="dt" text-anchor="middle">deforestation</text><path d="M396 103L362 182.2" class="dso" fill="none" stroke-width="3.5" marker-end="url(#o)"/><rect x="396" y="178" width="190" height="90" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="491" y="203" font-size="22" font-weight="700" class="dt" text-anchor="middle">Heavy metals</text><text x="491" y="231" font-size="22" class="dt" text-anchor="middle">Hg, Pb, As,</text><text x="491" y="259" font-size="22" class="dt" text-anchor="middle">Cu, Zn, Ni</text><path d="M396 223L362 230.2" class="dso" fill="none" stroke-width="3.5" marker-end="url(#o)"/><rect x="396" y="298" width="190" height="90" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="491" y="337" font-size="22" font-weight="700" class="dt" text-anchor="middle">Organophosphate</text><text x="491" y="365" font-size="22" class="dt" text-anchor="middle">pesticides</text><path d="M396 343L362 278.2" class="dso" fill="none" stroke-width="3.5" marker-end="url(#o)"/>
