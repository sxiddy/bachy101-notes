<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">A food chain that loops back</text><rect x="205" y="67" width="190" height="66" class="dfg dsg" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="94" font-size="26" font-weight="700" class="dt" text-anchor="middle">Green plant</text><text x="300" y="122" font-size="22" class="dt" text-anchor="middle">producer</text><rect x="395" y="182" width="190" height="66" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="490" y="209" font-size="26" font-weight="700" class="dt" text-anchor="middle">Grasshopper</text><text x="490" y="237" font-size="22" class="dt" text-anchor="middle">primary consumer</text><rect x="355" y="352" width="190" height="66" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="450" y="379" font-size="26" font-weight="700" class="dt" text-anchor="middle">Frog</text><text x="450" y="407" font-size="22" class="dt" text-anchor="middle">secondary consumer</text><rect x="55" y="352" width="190" height="66" class="dfo dso" rx="10" fill-opacity=".3" stroke-width="3"/><text x="150" y="379" font-size="26" font-weight="700" class="dt" text-anchor="middle">Snake</text><text x="150" y="407" font-size="22" class="dt" text-anchor="middle">tertiary consumer</text><rect x="15" y="182" width="190" height="66" class="dfr dsr" rx="10" fill-opacity=".3" stroke-width="3"/><text x="110" y="209" font-size="26" font-weight="700" class="dt" text-anchor="middle">Hawk</text><text x="110" y="237" font-size="22" class="dt" text-anchor="middle">final consumer</text><rect x="230" y="229" width="140" height="66" class="dfp dsp" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="256" font-size="26" font-weight="700" class="dt" text-anchor="middle">Fungi</text><text x="300" y="284" font-size="22" class="dt" text-anchor="middle">decomposers</text><path d="M395 125L500 178" class="dsb" fill="none" stroke-width="4" marker-end="url(#b)"/><path d="M490