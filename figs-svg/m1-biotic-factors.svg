<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Biotic (living) factors</text><rect x="14" y="56" width="572" height="90" class="dfg dsg" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="95" font-size="26" font-weight="700" class="dt" text-anchor="middle">Producers</text><text x="300" y="123" font-size="22" class="dt" text-anchor="middle">plants, algae, phytoplankton</text><rect x="14" y="166" width="572" height="90" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="205" font-size="26" font-weight="700" class="dt" text-anchor="middle">Consumers</text><text x="300" y="233" font-size="22" class="dt" text-anchor="middle">animals that eat other organisms</text><rect x="14" y="276" width="572" height="90" class="dfp dsp" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="315" font-size="26" font-weight="700" class="dt" text-anchor="middle">Decomposers</text><text x="300" y="343" font-size="22" class="dt" text-anchor="middle">bacteria and fungi</text>
