<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Biodiversity hotspots</text><rect x="14" y="56" width="572" height="70" class="dfg dsg" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="85" font-size="26" font-weight="700" class="dt" text-anchor="middle">36 hotspots worldwide</text><text x="300" y="113" font-size="22" class="dt" text-anchor="middle">high species richness + high endemism + threatened</text><text x="14" y="160" font-size="24" font-weight="700" class="dt">Three global examples</text><rect x="14" y="176" width="572" height="70" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="205" font-size="26" font-weight="700" class="dt" text-anchor="middle">Amazon Rainforest</text><text x="300" y="233" font-size="22" class="dt" text-anchor="middle">South America</text><rect x="14" y="254" width="572" height="70" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="283" font-size="26" font-weight="700" class="dt" text-anchor="middle">Congo Basin</text><text x="300" y="311" font-size="22" class="dt" text-anchor="middle">Central Africa</text><rect x="14" y="332" width="572" height="70" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="361" font-size="26" font-weight="700" class="dt" text-anchor="middle">Coral Triangle</text><text x="300" y="389" font-size="22" class="dt" text-anchor="middle">Southeast Asia, Pacific</text><text x="14" y="440" font-size="24" font-weight="700" class="dt">India has four of them</text><rect x="14" y="456" width="282" height="80" class="dfo dso" rx="10" fill-opacity=".3" stroke-width="3"/><text x="155" y="504" font-size="26" font-weight="700" class="dt" text-anchor="middle">Himalayas</text><rect x="304" y="456" width="282" height="80" class="dfo dso" rx="10" fill-opacity=".3" stroke-width="3"/><text x="445" y="504" font-size="26" font-weight="700" class="dt" text-anchor="middle">Western Ghats</text><rect x="14" y="548" width="282" height="80" class="dfo dso" rx="10" fill-opacity=".3" stroke-width="3"/><text x="155" y="582" font-size="26" font-weight="700" class="dt" text-anchor="middle">Indo-Burma</text><text x="155" y="610" font-size="22" class="dt" text-anchor="middle">north-east India</text><rect x="304" y="548" width="282" height="80" class="dfo dso" rx="10" fill-opacity=".3" stroke-width="3"/><text x="445" y="582" font-size="26" font-weight="700" class="dt" text-anchor="middle">Sundaland</text><text x="445" y="610" font-size="22" class="dt" text-anchor="middle">incl. Nicobar Islands</text>
