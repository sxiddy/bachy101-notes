<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">The mercury cycle</text><path d="M190 110H212" class="dso" fill="none" stroke-width="4" marker-end="url(#o)"/><path d="M386 110H408" class="dso" fill="none" stroke-width="4" marker-end="url(#o)"/><path d="M496 158V222" class="dso" fill="none" stroke-width="4" marker-end="url(#o)"/><path d="M410 270H388" class="dso" fill="none" stroke-width="4" marker-end="url(#o)"/><rect x="22" y="62" width="164" height="96" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="104" y="104" font-size="26" font-weight="700" class="dt" text-anchor="middle">Emitted</text><text x="104" y="132" font-size="22" class="dt" text-anchor="middle">to the air</text><circle cx="22" cy="62" r="17" class="dfg dsg" fill-opacity=".7" stroke-width="3"/><text x="22" y="69" font-size="22" font-weight="700" class="dt" text-anchor="middle">1</text><rect x="218" y="62" width="164" height="96" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="104" font-size="26" font-weight="700" class="dt" text-anchor="middle">Deposited</text><text x="300" y="132" font-size="22" class="dt" text-anchor="middle">by rain, snow</text><circle cx="218" cy="62" r="17" class="dfg dsg" fill-opacity=".7" stroke-width="3"/><text x="218" y="69" font-size="22" font-weight="700" class="dt" text-anchor="middle">2</text><rect x="414" y="62" width="164" height="96" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="496" y="104" font-size="26" font-weight="700" class="dt" text-anchor="middle">Collects in</text><text x="496" y="132" font-size="22" class="dt" text-anchor="middle">lakes, forests</text><circle cx="414" cy="62" r="17" class="dfg dsg" fill-opacity=".7" stroke-width="3"/><text x="414" y="69" font-size="22" font-weight="700" class="dt" text-anchor="middle">3</text><rect x="414" y="222" width="164" height="96" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="496" y="264" font-size="26" font-weight="700" class="dt" text-anchor="middle">Becomes</text><text x="496" y="292" font-size="22" class="dt" text-anchor="middle">methylmercury</text><circle cx="414" cy="222" r="17" class="dfg dsg" fill-opacity=".7" stroke-width="3"/><text x="414" y="229" font-size="22" font-weight="700" class="dt" text-anchor="middle">4</text><rect x="218" y="222" width="164" height="96" class="dfr dsr" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="264" font-size="26" font-weight="700" class="dt" text-anchor="middle">Builds up</text><text x="300" y="292" font-size="22" class="dt" text-anchor="middle">in food webs</text><circle cx="218" cy="222" r="17" class="dfg dsg" fill-opacity=".7" stroke-width="3"/><text x="218" y="229" font-size="22" font-weight="700" class="dt" text-anchor="middle">5</text><text x="300" y="360" font-size="22" class="dt2" text-anchor="middle">Methylmercury bioaccumulates: top predators</text><text x="300" y="388" font-size="22" class="dt2" text-anchor="middle">carry the most.</text>
</svg>
