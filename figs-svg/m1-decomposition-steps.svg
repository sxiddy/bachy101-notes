<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Five steps of decomposition</text><circle cx="40" cy="92" r="24" class="dfg dsg" fill-opacity=".4" stroke-width="3"/><text x="40" y="101" font-size="26" font-weight="700" class="dt" text-anchor="middle">1</text><rect x="80" y="56" width="506" height="72" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="333" y="86" font-size="26" font-weight="700" class="dt" text-anchor="middle">Fragmentation</text><text x="333" y="114" font-size="22" class="dt" text-anchor="middle">detritivores break matter into pieces</text><path d="M40 118V146" class="dsg" fill="none" stroke-width="3" marker-end="url(#g)"/><circle cx="40" cy="180" r="24" class="dfg dsg" fill-opacity=".4" stroke-width="3"/><text x="40" y="189" font-size="26" font-weight="700" class="dt" text-anchor="middle">2</text><rect x="80" y="144" width="506" height="72" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="333" y="174" font-size="26" font-weight="700" class="dt" text-anchor="middle">Leaching</text><text x="333" y="202" font-size="22" class="dt" text-anchor="middle">soluble nutrients wash into soil</text><path d="M40 206V234" class="dsg" fill="none" stroke-width="3" marker-end="url(#g)"/><circle cx="40" cy="268" r="24" class="dfg dsg" fill-opacity=".4" stroke-width="3"/><text x="40" y="277" font-size="26" font-weight="700" class="dt" text-anchor="middle">3</text><rect x="80" y="232" width="506" height="72" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="333" y="262" font-size="26" font-weight="700" class="dt" text-anchor="middle">Catabolism</text><text x="333" y="290" font-size="22" class="dt" text-anchor="middle">microbial enzymes break molecules down</text><path d="M40 294V322" class="dsg" fill="none" stroke-width="3" marker-end="url(#g)"/><circle cx="40" cy="356" r="24" class="dfg dsg" fill-opacity=".4" stroke-width="3"/><text x="40" y="365" font-size="26" font-weight="700" class="dt" text-anchor="middle">4</text><rect x="80" y="320" width="506" height="72" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="333" y="350" font-size="26" font-weight="700" class="dt" text-anchor="middle">Humification</text><text x="333" y="378" font-size="22" class="dt" text-anchor="middle">dark humus builds up</text><path d="M40 382V410" class="dsg" fill="none" stroke-width="3" marker-end="url(#g)"/><circle cx="40" cy="444" r="24" class="dfg dsg" fill-opacity=".4" stroke-width="3"/><text x="40" y="453" font-size="26" font-weight="700" class="dt" text-anchor="middle">5</text><rect x="80" y="408" width="506" height="72" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="333" y="438" font-size="26" font-weight="700" class="dt" text-anchor="middle">Mineralization</text><text x="333" y="466" font-size="22" class="dt" text-anchor="middle">inorganic nutrients are released</text>
</svg>
