<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Health hazards of BPA</text><rect x="14" y="56" width="572" height="68" class="dfr dsr" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="84" font-size="26" font-weight="700" class="dt" text-anchor="middle">Hormonal</text><text x="300" y="112" font-size="22" class="dt" text-anchor="middle">early puberty, low sperm count</text><rect x="14" y="132" width="572" height="68" class="dfo dso" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="160" font-size="26" font-weight="700" class="dt" text-anchor="middle">Cancer</text><text x="300" y="188" font-size="22" class="dt" text-anchor="middle">breast and prostate</text><rect x="14" y="208" width="572" height="68" class="dfr dsr" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="236" font-size="26" font-weight="700" class="dt" text-anchor="middle">Metabolic</text><text x="300" y="264" font-size="22" class="dt" text-anchor="middle">obesity, type 2 diabetes</text><rect x="14" y="284" width="572" height="68" class="dfo dso" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="312" font-size="26" font-weight="700" class="dt" text-anchor="middle">Cardiovascular</text><text x="300" y="340" font-size="22" class="dt" text-anchor="middle">hypertension, coronary disease</text><rect x="14" y="360" width="572" height="68" class="dfr dsr" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="388" font-size="26" font-weight="700" class="dt" text-anchor="middle">Thyroid</text><text x="300" y="416" font-size="22" class="dt" text-anchor="middle">raised TSH</text><rect x="14" y="436" width="572" height="68" class="dfo dso" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="464" font-size="26" font-weight="700" class="dt" text-anchor="middle">Neurological</text><text x="300" y="492" font-size="22" class="dt" text-anchor="middle">anxiety, poor memory, Alzheimer’s</text><rect x="14" y="512" width="572" height="68" class="dfr dsr" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="540" font-size="26" font-weight="700" class="dt" text-anchor="middle">Reproductive</text><text x="300" y="568" font-size="22" class="dt" text-anchor="middle">PCOS, endometriosis, infertility</text><rect x="14" y="588" width="572" height="68" class="dfo dso" rx="10" fill-opacity=".3" stroke-width="3"/><text x="300" y="616" font-size="26" font-weight="700" class="dt" text-anchor="middle">Immune</text><text x="300" y="644" font-size="22" class="dt" text-anchor="middle">allergies, asthma, inflammation</text>
</svg>
