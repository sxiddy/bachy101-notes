<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 550">
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfg"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfp"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Six ways to limit BPA</text><circle cx="40" cy="90" r="24" class="dfg dsg" fill-opacity=".4" stroke-width="3"/><text x="40" y="99" font-size="26" font-weight="700" class="dt" text-anchor="middle">1</text><rect x="80" y="56" width="506" height="68" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="333" y="84" font-size="26" font-weight="700" class="dt" text-anchor="middle">Eat fresh food</text><text x="333" y="112" font-size="22" class="dt" text-anchor="middle">not food stored in plastic or cans</text><circle cx="40" cy="170" r="24" class="dfg dsg" fill-opacity=".4" stroke-width="3"/><text x="40" y="179" font-size="26" font-weight="700" class="dt" text-anchor="middle">2</text><rect x="80" y="136" width="506" height="68" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="333" y="164" font-size="26" font-weight="700" class="dt" text-anchor="middle">Metal or ceramic cups</text><text x="333" y="192" font-size="22" class="dt" text-anchor="middle">for tea and coffee</text><circle cx="40" cy="250" r="24" class="dfg dsg" fill-opacity=".4" stroke-width="3"/><text x="40" y="259" font-size="26" font-weight="700" class="dt" text-anchor="middle">3</text><rect x="80" y="216" width="506" height="68" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="333" y="244" font-size="26" font-weight="700" class="dt" text-anchor="middle">Glass or steel bottles</text><text x="333" y="272" font-size="22" class="dt" text-anchor="middle">for water</text><circle cx="40" cy="330" r="24" class="dfg dsg" fill-opacity=".4" stroke-width="3"/><text x="40" y="339" font-size="26" font-weight="700" class="dt" text-anchor="middle">4</text><rect x="80" y="296" width="506" height="68" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="333" y="324" font-size="26" font-weight="700" class="dt" text-anchor="middle">Glass, not plastic</text><text x="333" y="352" font-size="22" class="dt" text-anchor="middle">for the microwave</text><circle cx="40" cy="410" r="24" class="dfg dsg" fill-opacity=".4" stroke-width="3"/><text x="40" y="419" font-size="26" font-weight="700" class="dt" text-anchor="middle">5</text><rect x="80" y="376" width="506" height="68" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="333" y="404" font-size="26" font-weight="700" class="dt" text-anchor="middle">Metal or ceramic plates</text><text x="333" y="432" font-size="22" class="dt" text-anchor="middle">not plastic plates</text><circle cx="40" cy="490" r="24" class="dfg dsg" fill-opacity=".4" stroke-width="3"/><text x="40" y="499" font-size="26" font-weight="700" class="dt" text-anchor="middle">6</text><rect x="80" y="456" width="506" height="68" class="dfb dsb" rx="10" fill-opacity=".3" stroke-width="3"/><text x="333" y="484" font-size="26" font-weight="700" class="dt" text-anchor="middle">Cotton toys</text><text x="333" y="512" font-size="22" class="dt" text-anchor="middle">not plastic toys for children</text>
</svg>
