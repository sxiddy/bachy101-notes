<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
<defs><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfw"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfb"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfy"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfo"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" class="dfr"/></marker></defs>
<text x="300" y="34" font-size="28" font-weight="700" class="dt" text-anchor="middle">Geothermal plant types</text>
<g transform="translate(0,50)"><text x="20" y="28" font-size="26" class="dt">1. Dry steam (oldest, rare)</text><rect x="20" y="180" width="560" height="40" class="dfr" fill-opacity=".25"/><text x="300" y="208" font-size="22" class="dt" text-anchor="middle">reservoir gives natural dry steam</text><path d="M70 180 L70 80 L250 80" class="dsr" stroke-width="4" fill="none" marker-end="url(#r)"/><text x="90" y="70" font-size="22" class="dtr">steam</text><rect x="255" y="55" width="90" height="50" class="dfy" fill-opacity=".6"/><text x="300" y="135" font-size="22" class="dt" text-anchor="middle">turbine + generator</text><path d="M345 80 L520 80 L520 175" class="dsb" stroke-width="4" fill="none" marker-end="url(#b)"/><text x="400" y="70" font-size="22" class="dtb">cooled water</text><text x="90" y="165" font-size="22" class="dt2">production well</text><text x="510" y="165" font-size="22" class="dt2" text-anchor="end">injection</text></g>
<g transform="translate(0,300)"><text x="20" y="28" font-size="26" class="dt">2. Flash steam (most common)</text><rect x="20" y="180" width="560" height="40" class="dfo" fill-opacity=".25"/><text x="300" y="208" font-size="22" class="dt" text-anchor="middle">hot pressurised water above 180 °C</text><path d="M60 180 L60 85 L110 85" class="dso" stroke-width="4" fill="none" marker-end="url(#o)"/><rect x="115" y="55" width="90" height="60" class="dfb" fill-opacity=".3"/><text x="160" y="140" font-size="22" class="dt" text-anchor="middle">flash tank</text><path d="M205 70 L290 70" class="dsr" stroke-width="4" marker-end="url(#r)"/><text x="215" y="55" font-size="22" class="dtr">steam</text><rect x="295" y="48" width="90" height="45" class="dfy" fill-opacity=".6"/><text x="400" y="78" font-size="22" class="dt">turbine</text><path d="M195 115 L195 165 L540 165 L540 176" class="dsb" stroke-width="4" fill="none" marker-end="url(#b)"/><text x="240" y="155" font-size="22" class="dtb">leftover water re-injected</text></g>
<g transform="translate(0,550)"><text x="20" y="28" font-size="26" class="dt">3. Binary cycle (100–180 °C)</text><rect x="20" y="180" width="560" height="40" class="dfo" fill-opacity=".25"/><text x="300" y="208" font-size="22" class="dt" text-anchor="middle">moderately hot water</text><path d="M60 180 L60 95 L120 95" class="dso" stroke-width="4" fill="none" marker-end="url(#o)"/><rect x="125" y="62" width="110" height="66" class="df2 ds" stroke-width="2"/><text x="180" y="102" font-size="22" class="dt" text-anchor="middle">HX</text><path d="M180 128 L180 165 L540 165 L540 176" class="dsb" stroke-width="4" fill="none" marker-end="url(#b)"/><text x="250" y="155" font-size="22" class="dtb">all water re-injected</text><path d="M235 85 L330 85" class="dsy" stroke-width="4" marker-end="url(#y)"/><rect x="335" y="60" width="90" height="50" class="dfy" fill-opacity=".6"/><text x="440" y="92" font-size="22" class="dt">turbine</text><text x="125" y="56" font-size="22" class="dty">heat exchanger → isobutane/pentane</text></g>
</svg>
